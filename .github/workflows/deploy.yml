name: Build & Push API

on:
  push:
    branches:
      - main
      - develop

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker secrets
        run: |
          echo "USERNAME=${{ secrets.DOCKER_USERNAME != '' }}"
          echo "PASSWORD=${{ secrets.DOCKER_PASSWORD != '' }}"

      - name: Debug
        run: |
          echo "ENV=${{ job.environment.name }}"
          echo "USER=${{ secrets.DOCKER_USERNAME != '' }}"
          echo "PASS=${{ secrets.DOCKER_PASSWORD != '' }}"
          
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile # hoặc ./Dockerfile nếu ở root
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/car-market-api:latest
            ${{ secrets.DOCKER_USERNAME }}/car-market-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
